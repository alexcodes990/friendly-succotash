<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Robby: Double Jump</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #0f0f1a;
      font-family: 'Segoe UI', system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 16px;
    }

    .game-card {
      background: #1a1a2e;
      border-radius: 16px;
      padding: 16px;
      width: 100%;
      max-width: 960px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
      border: 1px solid #2a2a4a;
    }

    .game-title {
      color: #fff;
      font-size: 1.2rem;
      margin-bottom: 12px;
      text-align: center;
    }

    /* Responsive iframe wrapper */
    .iframe-wrapper {
      position: relative;
      width: 100%;
      padding-bottom: 56.25%; /* 16:9 aspect ratio */
      height: 0;
      overflow: hidden;
      border-radius: 12px;
      background: #000;
    }

    .iframe-wrapper iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
      border-radius: 12px;
    }

    /* Mobile tweaks */
    @media (max-width: 640px) {
      body {
        padding: 8px;
      }
      .game-card {
        padding: 10px;
        border-radius: 12px;
      }
      .game-title {
        font-size: 1rem;
      }
    }

    /* Landscape phone */
    @media (max-height: 500px) and (orientation: landscape) {
      .iframe-wrapper {
        padding-bottom: 75%; /* slightly taller for landscape phones */
      }
    }
  </style>
</head>
<body>

  <div class="game-card">
    <h1 class="game-title">🚀 Robby: Double Jump for Brainrots</h1>
    
    <div class="iframe-wrapper">
      <iframe 
        src="https://playgama.com/export/game/robby-double-jump-for-brainrots?clid=p_cc357a40-3c85-49ab-aa94-d1f75dba21ee" 
        allow="fullscreen; accelerometer; camera; clipboard-read; clipboard-write; screen-wake-lock; speaker-selection; web-share; geolocation; gyroscope; microphone; xr-spatial-tracking; autoplay; encrypted-media; picture-in-picture; payment; publickey-credentials-get; publickey-credentials-create; storage-access; attribution-reporting; browsing-topics" 
        allowfullscreen>
      </iframe>
    </div>
  </div>

</body>
</html>
